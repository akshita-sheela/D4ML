# Central configuration for the recommendation pipeline.
seed: 42
reference_date: "2026-01-01"      # "today" for the pipeline; fixed => reproducible validation/features

paths:
  raw: data/raw
  processed: data/processed
  features: data/features
  errors: data/errors
  models: models
  reports: reports

data:
  source: synthetic               # synthetic | csv  (csv = use files already in data/raw)
  n_users: 2000
  n_items: 800
  n_interactions: 60000
  start_date: "2023-01-01"
  end_date: "2025-12-31"

validation:
  rating_min: 1
  rating_max: 5
  age_min: 10
  age_max: 100
  release_year_min: 1900

split:
  test_fraction: 0.2              # time-based: most recent 20% of interactions -> test

features:
  bayes_smoothing_m: 5            # prior strength for smoothed item average rating

evaluation:
  k: 10
  positive_threshold: 4           # rating >= 4 counts as a "relevant" interaction

models:
  popularity: {}
  item_knn: {n_neighbors: 50}
  svd_mf: {n_factors: 32, n_factors_rating: 16}

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: recsys-pipeline
